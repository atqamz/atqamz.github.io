name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Elm
        run: npm install --global elm@0.19.1-6
      - name: Build homepage
        run: make -C apps/web build
      - uses: actions/upload-artifact@v6
        with:
          name: web
          path: apps/web/dist

  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build shortlinks
        run: make -C apps/short build
      - uses: actions/upload-artifact@v6
        with:
          name: short
          path: apps/short/dist

  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build resume with Cloudflare-compatible toolchain
        run: make -C apps/resume build-ci
      - uses: actions/upload-artifact@v6
        with:
          name: resume
          path: apps/resume/dist

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run check
